<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tissue — Issue Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <h1><a href="#" id="home-link">Tissue</a></h1>
      <p class="tagline">issue viewer for humans and agents</p>
    </header>
    <div class="layout">
      <nav class="sidebar" aria-label="Main navigation">
        <!-- #178: the project selector is the TOP element of the sidebar —
             projects are the main unit; switching filters everything. -->
        <div class="project-block">
          <h3 class="sidebar-heading">Project</h3>
          <select id="project-select" class="project-select" aria-label="Active project">
            <option value="">All projects</option>
          </select>
        </div>
        <ul class="nav">
          <li><a href="#/issues" class="nav-link" data-view="issues">Issues</a></li>
          <li><a href="#/review" class="nav-link" data-view="review">Needs Review</a></li>
          <li><a href="#/releases" class="nav-link" data-view="releases">Releases</a></li>
          <li><a href="#/projects" class="nav-link" data-view="projects">Projects</a></li>
          <li><a href="#/settings" class="nav-link" data-view="settings">Settings</a></li>
        </ul>
        <div class="filter-block">
          <h3 class="sidebar-heading">Status</h3>
          <ul class="status-filter" id="status-filter">
            <li><a href="#/issues?status=open" class="filter-link" data-status="open">open</a></li>
            <li><a href="#/issues?status=in-progress" class="filter-link" data-status="in-progress">in-progress</a></li>
            <li><a href="#/issues?status=closed" class="filter-link" data-status="closed">closed</a></li>
            <li><a href="#/issues" class="filter-link" data-status="">all</a></li>
          </ul>
        </div>
      </nav>
      <main id="app" class="content">
        <p class="loading">Loading…</p>
      </main>
    </div>
  </div>
  <footer class="app-footer" id="app-footer">tissue v__TISSUE_VERSION__ · API v1 · GPL-3.0-only</footer>
  <script src="app.js"></script>
</body>
</html>
