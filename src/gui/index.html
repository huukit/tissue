<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tissue — Issue Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <h1><a href="#" id="home-link">Tissue</a></h1>
      <p class="tagline">issue viewer for humans and agents</p>
    </header>
    <div class="layout">
      <nav class="sidebar" aria-label="Main navigation">
        <ul class="nav">
          <li><a href="#/issues" class="nav-link" data-view="issues">Issues</a></li>
          <li><a href="#/review" class="nav-link" data-view="review">Needs Review</a></li>
          <li><a href="#/releases" class="nav-link" data-view="releases">Releases</a></li>
          <li><a href="#/settings" class="nav-link" data-view="settings">Settings</a></li>
        </ul>
        <div class="project-block">
          <h3 class="sidebar-heading">Project</h3>
          <select id="project-select" class="project-select" aria-label="Project filter">
            <option value="">All projects</option>
          </select>
          <button id="new-project-btn" class="btn btn-ghost" title="Create a project (needs the API token)">+ New project</button>
          <div id="new-project-form" class="new-project-form" hidden>
            <input id="new-project-name" type="text" placeholder="name (e.g. ops)" aria-label="Project name">
            <input id="new-project-prefix" type="text" placeholder="prefix (e.g. OPS)" aria-label="Issue-id prefix">
            <button id="new-project-create" class="btn">Create</button>
            <button id="new-project-cancel" class="btn btn-ghost">Cancel</button>
            <p id="new-project-result" class="edit-result" aria-live="polite"></p>
          </div>
        </div>
        <div class="filter-block">
          <h3 class="sidebar-heading">Status</h3>
          <ul class="status-filter" id="status-filter">
            <li><a href="#/issues?status=open" class="filter-link" data-status="open">open</a></li>
            <li><a href="#/issues?status=in-progress" class="filter-link" data-status="in-progress">in-progress</a></li>
            <li><a href="#/issues?status=closed" class="filter-link" data-status="closed">closed</a></li>
            <li><a href="#/issues" class="filter-link" data-status="">all</a></li>
          </ul>
        </div>
      </nav>
      <main id="app" class="content">
        <p class="loading">Loading…</p>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
