name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt / check / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: cargo check on MSRV
        run: cargo check --workspace --all-targets

  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@latest

      - name: cargo audit
        run: cargo audit

  release:
    name: static binary (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Build static release binary
        working-directory: src
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Verify the binary is fully static
        run: |
          bin=src/target/x86_64-unknown-linux-musl/release/tissue
          test -x "$bin"
          if ldd "$bin" 2>&1 | grep -Eq "not a dynamic executable|statically linked"; then
            echo "OK: static binary"
          else
            echo "::error::Binary is dynamically linked:"
            ldd "$bin"
            exit 1
          fi

      - name: Smoke test (version, help, init/create/list round trip, standalone serve)
        run: |
          set -eu
          bin="$PWD/src/target/x86_64-unknown-linux-musl/release/tissue"
          "$bin" --version
          "$bin" --help | grep -q "tissue"
          scratch="$(mktemp -d)"
          cd "$scratch"
          git init --quiet
          git config user.email smoke@tissue.test
          git config user.name smoke
          "$bin" init
          "$bin" create IAM-1 "smoke" --body "round trip"
          "$bin" list | grep -q "IAM-1"
          "$bin" show IAM-1 | grep -q "round trip"
          # Standalone path: binary outside any source tree must serve the GUI
          # and API from embedded assets (guard for #39's defect class).
          cp "$bin" ./tissue-standalone
          ./tissue-standalone serve --port 7399 &
          srv=$!
          for _ in $(seq 1 50); do
            if command -v curl >/dev/null && curl -sf http://127.0.0.1:7399/ >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          grep_out="$(python3 -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:7399/').read().decode())" )" || true
          case "$grep_out" in
            *"<html"*|*"<!DOCTYPE"*) echo "standalone serve: GUI served" ;;
            *) echo "::error::standalone serve did not return the GUI"; kill $srv; exit 1 ;;
          esac
          api="$(python3 -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:7399/api/issues').read().decode())")"
          case "$api" in *"IAM-1"*) echo "standalone serve: API live" ;; *) echo "::error::standalone API missing IAM-1"; kill $srv; exit 1 ;; esac
          kill $srv

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: tissue-x86_64-unknown-linux-musl
          path: src/target/x86_64-unknown-linux-musl/release/tissue
          if-no-files-found: error

  gui:
    name: gui (tsc sync check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compile app.ts strictly and compare with checked-in app.js
        run: |
          set -eu
          cd src/gui
          npx -y -p typescript@5.6 tsc --strict --noEmitOnError --target es2017 app.ts --outFile /tmp/app-fresh.js
          if cmp -s app.js /tmp/app-fresh.js; then
            echo "OK: app.js matches a fresh strict tsc compile of app.ts"
          else
            echo "::error::app.js is stale or hand-edited relative to app.ts. Regenerate with:"
            echo "::error::  cd src/gui && npx -y -p typescript@5.6 tsc --strict --noEmitOnError --target es2017 app.ts --outFile app.js"
            diff app.js /tmp/app-fresh.js || true
            exit 1
          fi

  linear-history:
    name: linear history (no merge commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject merge commits in PR ancestry
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              echo "No previous main head to compare against; skipping range check"
              exit 0
            fi
          fi
          merges="$(git rev-list --merges "$base..$head")"
          if [ -n "$merges" ]; then
            echo "::error::Merge commits found in PR ancestry (AGENTS.md §2 forbids merge commits):"
            echo "$merges" | while read -r sha; do
              git --no-pager log -1 --format='  %h %s' "$sha"
            done
            exit 1
          fi
          echo "OK: no merge commits in $base..$head"

  container:
    name: container image (build + upload tar)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build the tissue image
        run: docker build -f Dockerfile -t tissue:poc .
      - name: Verify final image contains only the tissue binary
        run: |
          set -eu
          # Inspect the image itself (docker save -> layer tars), not a
          # container: docker export includes runtime device files.
          docker save tissue:poc -o /tmp/img.tar
          mkdir -p /tmp/img && tar -xf /tmp/img.tar -C /tmp/img
          find /tmp/img -name layer.tar -print0 |
            while IFS= read -r -d '' layer; do
              tar -tvf "$layer" | awk '{print $NF}'
            done | sed 's|^\./||' | sort -u > /tmp/entries.txt
          bad="$(grep -v -e '^tissue$' -e '^/$' -e '^$' /tmp/entries.txt || true)"
          if [ -n "$bad" ]; then
            echo "::error::Unexpected files in final image:"
            echo "$bad"
            exit 1
          fi
          echo "OK: final image contains only the tissue binary"
      - name: Loopback-only publish smoke test
        run: |
          set -eu
          scratch="$(mktemp -d)"
          # Bootstrap on the host with a locally built binary: init
          # shells out to the git CLI, which the binary-only image
          # intentionally omits (AC3). The container is for viewing.
          (cd src && cargo build -p tissue-cli --quiet)
          src/target/debug/tissue init --repo "$scratch" >/dev/null
          docker run --rm -d --name tissue-smoke --network host             -v "$scratch:/issues" tissue:poc             serve --port 8080 --repo /issues >/dev/null
          ok=""
          for i in 1 2 3 4 5; do
            sleep 2
            if code="$(python3 -c "import urllib.request;print(urllib.request.urlopen('http://127.0.0.1:8080/').status)" 2>/dev/null)" \
               && [ "$code" = "200" ]; then
              ok=yes
              break
            fi
            echo "attempt $i failed (code=${code:-none}); container logs:"
            docker logs tissue-smoke 2>&1 | tail -5
          done
          docker logs tissue-smoke 2>&1 | tail -10
          test "$ok" = "yes"
          echo "OK: GUI reachable on loopback (127.0.0.1 only)"
          docker stop tissue-smoke >/dev/null
      - name: Export image tar
        run: docker save tissue:poc -o /tmp/tissue-poc-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: tissue-poc-container-image
          path: /tmp/tissue-poc-image.tar
          retention-days: 14
