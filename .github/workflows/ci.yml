name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt / check / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: cargo check on MSRV
        run: cargo check --workspace --all-targets

  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@latest

      - name: cargo audit
        run: cargo audit

  release:
    name: static binary (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Build static release binary
        working-directory: src
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Verify the binary is fully static
        run: |
          bin=src/target/x86_64-unknown-linux-musl/release/tissue
          test -x "$bin"
          if ldd "$bin" 2>&1 | grep -Eq "not a dynamic executable|statically linked"; then
            echo "OK: static binary"
          else
            echo "::error::Binary is dynamically linked:"
            ldd "$bin"
            exit 1
          fi

      - name: Smoke test (version, help, init/create/list round trip)
        run: |
          set -eu
          bin="$PWD/src/target/x86_64-unknown-linux-musl/release/tissue"
          "$bin" --version
          "$bin" --help | grep -q "tissue"
          scratch="$(mktemp -d)"
          cd "$scratch"
          git init --quiet
          git config user.email smoke@tissue.test
          git config user.name smoke
          "$bin" init
          "$bin" create IAM-1 "smoke" --body "round trip"
          "$bin" list | grep -q "IAM-1"
          "$bin" show IAM-1 | grep -q "round trip"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: tissue-x86_64-unknown-linux-musl
          path: src/target/x86_64-unknown-linux-musl/release/tissue
          if-no-files-found: error

  linear-history:
    name: linear history (no merge commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject merge commits in PR ancestry
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              echo "No previous main head to compare against; skipping range check"
              exit 0
            fi
          fi
          merges="$(git rev-list --merges "$base..$head")"
          if [ -n "$merges" ]; then
            echo "::error::Merge commits found in PR ancestry (AGENTS.md §2 forbids merge commits):"
            echo "$merges" | while read -r sha; do
              git --no-pager log -1 --format='  %h %s' "$sha"
            done
            exit 1
          fi
          echo "OK: no merge commits in $base..$head"
