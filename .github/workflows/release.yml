name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: tissue-x86_64-unknown-linux-musl.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: tissue-x86_64-pc-windows-msvc.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tissue-aarch64-apple-darwin.tar.gz
    steps:
      - uses: actions/checkout@v5
      - name: Version guard: tag must match workspace version
        working-directory: src
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          workspace="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')"
          if [ "$tag" != "$workspace" ]; then
            echo "::error::tag v${tag} does not match workspace version ${workspace} (src/Cargo.toml). Bump the workspace version before cutting the tag."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
      - name: Build release binary
        working-directory: src
        run: cargo build --release --target ${{ matrix.target }}
      - name: Smoke test
        working-directory: src
        shell: bash
        run: |
          set -eu
          case "$RUNNER_OS" in
            Windows) ext=.exe ;;
            *) ext= ;;
          esac
          bin="target/${{ matrix.target }}/release/tissue$ext"
          "$bin" --version
          "$bin" --help | grep -q "tissue"
          # Functional round trip on a scratch repo (skip on macos runners:
          # no git CLI guarantee in the bare runner image).
          if [ "$RUNNER_OS" != macOS ]; then
            scratch="$(mktemp -d)"
            pushd "$scratch"
            git init --quiet
            git config user.email smoke@tissue.test
            git config user.name smoke
            "$OLDPWD/$bin" init >/dev/null
            "$OLDPWD/$bin" create IAM-1 smoke --body "round trip" >/dev/null
            "$OLDPWD/$bin" list | grep -q "IAM-1"
            popd
          fi

      - name: Staticness check (musl only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        working-directory: src
        run: |
          bin="target/${{ matrix.target }}/release/tissue"
          if ldd "$bin" 2>&1 | grep -Eq "not a dynamic executable|statically linked"; then
            echo "OK: static binary"
          else
            echo "::error::Release binary is dynamically linked:"
            ldd "$bin"
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          set -eu
          cd "src/target/${{ matrix.target }}/release"
          case "$RUNNER_OS" in
            Windows) ext=.exe ;;
            *) ext= ;;
          esac
          bin=tissue$ext
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "${{ matrix.archive }}" "$bin"
          else
            tar czf "${{ matrix.archive }}" "$bin"
          fi
          sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive }}
          path: |
            src/target/${{ matrix.target }}/release/${{ matrix.archive }}
            src/target/${{ matrix.target }}/release/${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish:
    name: publish release
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            tissue-*.tar.gz
            tissue-*.tar.gz.sha256
            tissue-*.zip
            tissue-*.zip.sha256
