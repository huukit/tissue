name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tissue-x86_64-unknown-linux-musl.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: tissue-x86_64-pc-windows-msvc.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tissue-aarch64-apple-darwin.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
      - name: Build release binary
        working-directory: src
        run: cargo build --release --target ${{ matrix.target }}
      - name: Smoke test
        working-directory: src
        shell: bash
        run: |
          set -eu
          bin="target/${{ matrix.target }}/release/tissue$( [ "$RUNNER_OS" = Windows ] && echo '.exe' )"
          "$bin" --version
          "$bin" --help | grep -q "tissue"
      - name: Package
        shell: bash
        run: |
          set -eu
          cd "src/target/${{ matrix.target }}/release"
          bin=tissue$( [ "$RUNNER_OS" = Windows ] && echo '.exe' )
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "${{ matrix.archive }}" "$bin"
          else
            tar czf "${{ matrix.archive }}" "$bin"
          fi
          sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            src/target/${{ matrix.target }}/release/${{ matrix.archive }}
            src/target/${{ matrix.target }}/release/${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            tissue-*.tar.gz
            tissue-*.tar.gz.sha256
            tissue-*.zip
            tissue-*.zip.sha256
